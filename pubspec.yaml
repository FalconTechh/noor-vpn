name: noor_vpn
description: "Noor VPN - Fast, secure & elegant VPN"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Ads (monetization)
  google_mobile_ads: ^5.1.0

  # Animation & UI polish
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # State management (simple, beginner friendly)
  provider: ^6.1.2

  # Local storage (settings, selected server)
  shared_preferences: ^2.2.3

  # VPN tunnel (WireGuard). NOTE: you must add this plugin
  # and follow its native Android setup steps (see README step 4).
  wireguard_flutter: ^0.1.3

  # Google Sign-In (login screen) — requires Firebase/Google Cloud OAuth
  # setup, see README Step 7.
  google_sign_in: ^6.2.1

  # Premium subscriptions via Google Play Billing — required by Play
  # Store policy for any digital-good subscription, see README Step 8.
  in_app_purchase: ^3.2.0

  # Networking (fetch server list / ping)
  http: ^1.2.1

  # Opens mailto: links (Contact Support) and external URLs
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App launcher icon (what shows on the phone home screen)
flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#060B18"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive.png"

# Native splash screen (shows for a split second BEFORE Flutter loads,
# separate from our custom animated SplashScreen widget in lib/screens).
# Without this config, Android shows its own default WHITE screen here.
flutter_native_splash:
  color: "#060B18"
  image: assets/images/app_logo.png
  android_12:
    color: "#060B18"
    image: assets/images/app_logo.png
